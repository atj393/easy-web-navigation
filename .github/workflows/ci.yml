name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck · lint · format · test · build · manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not pin a pnpm version here: the version is read from the
      # "packageManager" field in package.json (pnpm@9.15.9). Specifying both
      # causes pnpm/action-setup to fail with ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Formatting was previously checked by no job at all, so `pnpm
      # format:check` had drifted red on main.
      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build (Chromium / MV3)
        run: pnpm build

      - name: Build (Firefox)
        run: pnpm build:firefox

      # The permission surface is part of the product; assert the BUILT
      # manifests rather than trusting the config that generates them.
      - name: Validate manifests
        run: pnpm check:manifest
